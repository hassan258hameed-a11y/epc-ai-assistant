{% extends "base/public.html" %}
{% block title %}Access denied · {{ BRAND.full_name }}{% endblock %}
{% block content %}
<section class="relative flex min-h-[70vh] items-center overflow-hidden mesh">
  <div class="relative mx-auto max-w-lg px-4 py-20 text-center">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl border border-amber-500/20 bg-amber-500/10 text-amber-600 dark:text-amber-400">
      <svg class="h-7 w-7" aria-hidden="true"><use href="#i-lock"/></svg>
    </div>
    <h1 class="mt-6 text-2xl font-bold tracking-tight text-ink-900 dark:text-white sm:text-3xl">You don't have access</h1>
    <p class="mx-auto mt-3 max-w-sm text-sm leading-relaxed text-ink-600 dark:text-ink-400">
      This area is restricted. If you believe you should have access, contact your administrator.
    </p>
    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a href="{% url 'public:home' %}" class="btn-primary">Back to home</a>
      <a href="{% url 'auth:login' %}" class="btn-outline">Sign in</a>
    </div>
  </div>
</section>
{% endblock %}
