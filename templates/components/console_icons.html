{% comment %}
Console icon sprite — the handful of symbols the admin chrome needs on top
of components/icons.html. Same 24px grid, same 1.75 stroke, so the two
sprites are indistinguishable in use.
  <svg class="h-5 w-5"><use href="#i-trend-up"/></svg>
{% endcomment %}
<svg xmlns="http://www.w3.org/2000/svg" class="hidden" aria-hidden="true">

  <symbol id="i-panel-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/>
  </symbol>

  <symbol id="i-trend-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 16.5 5.5-5.5 3.5 3.5L21 5.5"/><path d="M15.5 5.5H21v5.5"/>
  </symbol>

  <symbol id="i-trend-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 7.5 5.5 5.5L12 9.5 21 18.5"/><path d="M15.5 18.5H21V13"/>
  </symbol>

  <symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/>
  </symbol>

  <symbol id="i-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 15 6-6 6 6"/>
  </symbol>

  <symbol id="i-arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 17 17 7"/><path d="M8.5 7H17v8.5"/>
  </symbol>


  <symbol id="i-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h4l2.5-7 5 14L17 12h4"/>
  </symbol>

  <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </symbol>

  <symbol id="i-server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/>
    <path d="M7 7.5h.01M7 16.5h.01"/>
  </symbol>

  <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7.5A1.5 1.5 0 0 1 5 6h4.5"/>
  </symbol>

  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/>
  </symbol>

  <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 11.2V4.8A1.3 1.3 0 0 1 4.8 3.5h6.4a1.3 1.3 0 0 1 .93.39l8.1 8.1a1.3 1.3 0 0 1 0 1.85l-6.4 6.4a1.3 1.3 0 0 1-1.85 0l-8.1-8.1a1.3 1.3 0 0 1-.38-.94Z"/>
    <path d="M7.6 7.6h.01"/>
  </symbol>

  <symbol id="i-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
    <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
  </symbol>

  <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>
  </symbol>

  <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 13.5h4l1.5 3h6l1.5-3h4"/>
    <path d="M5.6 4.8h12.8a1.5 1.5 0 0 1 1.4 1l2.2 6.2V18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6l2.2-6.2a1.5 1.5 0 0 1 1.4-1Z"/>
  </symbol>
</svg>
