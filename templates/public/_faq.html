<div class="card overflow-hidden" data-faq>
  <button type="button" data-faq-toggle aria-expanded="false"
          class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left transition hover:bg-ink-50 dark:hover:bg-white/[.03]">
    <span class="text-sm font-semibold text-ink-900 dark:text-white sm:text-base">{{ q }}</span>
    <svg data-faq-icon class="h-4 w-4 shrink-0 text-ink-400 transition-transform duration-300" aria-hidden="true">
      <use href="#i-chevron-down"/>
    </svg>
  </button>
  <div data-faq-panel style="max-height:0" class="overflow-hidden transition-[max-height] duration-300 ease-out">
    <p class="px-5 pb-5 text-sm leading-relaxed text-ink-600 dark:text-ink-400">{{ a }}</p>
  </div>
</div>
