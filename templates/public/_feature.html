<div class="card card-hover p-6" data-reveal>
  <span class="flex h-11 w-11 items-center justify-center rounded-xl border border-brand-500/15 bg-gradient-to-br from-brand-500/12 to-accent-500/12 text-brand-600 dark:text-brand-300">
    <svg class="h-5 w-5" aria-hidden="true"><use href="#{{ icon }}"/></svg>
  </span>
  <h3 class="mt-4 text-base font-semibold text-ink-900 dark:text-white">{{ title }}</h3>
  <p class="mt-2 text-sm leading-relaxed text-ink-600 dark:text-ink-400">{{ body }}</p>
</div>
